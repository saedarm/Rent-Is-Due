# Pick an app name nobody has taken, then: fly apps create <name> && fly deploy --ha=false
app = "rents-due-sam"
primary_region = "ord"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"     # sleeps when nobody is connected; change to "off" if it ever naps mid-game
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
