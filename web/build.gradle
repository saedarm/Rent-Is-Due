plugins { id 'com.github.xpenatan.gdx-teavm' version '1.6.2' }
dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation project(':core')
}
gdxTeaVM {
    assets.from(rootProject.file('assets'))
    webDefaults {
        mainClass.set('rob.web.WebLauncher')
        htmlTitle.set("Rent's Due")
    }
    js { }
}
